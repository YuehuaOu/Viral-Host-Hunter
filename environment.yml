name: VHH
channels:
  - nvidia        # 用于 pytorch-cuda
  - pytorch
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.8
  - pip
  - numpy=1.24.3
  - pandas=2.0.3
  - scanpy=1.8.2
  - networkx=2.8
  - pytorch=2.4.0
  - torchvision=0.19.0
  - torchaudio=2.4.0
  - pytorch-cuda=11.8
  - pip:
      - biopython==1.81
      - transformers==4.38.2
      - sentencepiece==0.2.0
      - scikit-learn==1.3.2
      - openpyxl==3.1.4
      - viral-host-hunter==0.1.2
